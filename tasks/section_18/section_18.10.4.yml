---

- name: "18.10.4.1 | PATCH | Ensure Allow a Windows app to share application data between users is set to Disabled"
  when: win25cis_rule_18_10_4_1
  tags:
    - level2-domaincontroller
    - level2-memberserver
    - rule_18.10.4.1
    - patch
    - data
    - NIST800-171_3.3.1
    - NIST800-53R5_AC-3
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\Appmodel\Statemanager
    name: AllowSharedLocalAppData
    data: 0
    type: dword

- name: "18.10.4.2 | PATCH | Ensure 'Not allow per-user unsigned packages to install by default (requires explicitly allow per install)' is set to Enabled"
  when: win25cis_rule_18_10_4_2
  tags:
    - level1-domaincontroller
    - level1-memberserver
    - rule_18.10.4.2
    - patch
    - appx
    - storeapps
    - NIST800-171_3.4.6
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
  ansible.windows.win_regedit:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\Appx
    name: DisablePerUserUnsignedPackagesByDefault
    data: 1
    type: dword
