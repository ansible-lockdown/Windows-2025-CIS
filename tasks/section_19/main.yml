---

- name: "AUDIT | Obtain Current Interactive User Hives"
  when: win25cis_section19
  tags: always
  block:
    - name: AUDIT | Obtain Current Interactive User Hives | Retrieve live domain user SIDs from HKEY_USERS
      ansible.windows.win_shell: "{{ hku_script }}"
      vars:
        hku_script: |
          $users = (Get-ChildItem 'REGISTRY::HKEY_USERS').Name
          $users | Where-Object {
            $_ -match 'S-1-5-21-' -and
            $_ -notlike '*_Classes' -and
            $_ -notmatch 'S-1-5-18|S-1-5-19|S-1-5-20' -and
            $_ -notmatch 'S-1-5-80-'
          } | ForEach-Object { $_ -replace 'HKEY_USERS\\', '' }
      changed_when: false
      check_mode: false
      register: discovered_current_users_loaded_hku

    - name: AUDIT | Obtain Current Interactive User Hives | Set list fact for live user SIDs
      ansible.builtin.set_fact:
        discovered_hku_loaded_list: "{{ discovered_current_users_loaded_hku.stdout_lines }}"

- name: "SECTION | 19.x | Administrative Templates"
  ansible.builtin.import_tasks:
    file: section_19.x.yml
