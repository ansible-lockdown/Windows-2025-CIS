---

- name: "2.3.5.1 | PATCH | Ensure Domain controller Allow server operators to schedule tasks is set to Disabled DC only | Domain Controller"
  when:
    - win25cis_rule_2_3_5_1
    - prelim_win25cis_is_domain_controller
  tags:
    - level1-domaincontroller
    - rule_2.3.5.1
    - patch
    - scheduledtasks
    - NIST800-171_3.1.5
    - NIST800-53R5_AC-6_8
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\Lsa
    name: SubmitControl
    data: 0
    type: dword

# Per CIS Note: If this policy is set as prescribed, the registry key vulnerablechannelallowlist will not be present in the above registry location.
- name: "2.3.5.2 | PATCH | Ensure Domain controller Allow vulnerable Netlogon secure channel connections is set to Not Configured DC only | Domain Controller"
  when:
    - win25cis_rule_2_3_5_2
    - prelim_win25cis_is_domain_controller
  tags:
    - level1-domaincontroller
    - rule_2.3.5.2
    - patch
    - logon
    - NIST800-171_3.4.2
    - NIST800-53R5_CM-6_b
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
    name: VulnerableChannelAllowList
    data: 0
    type: dword

- name: "2.3.5.3 | PATCH | Ensure Domain controller LDAP server channel binding token requirements is set to Always DC only | Domain Controller"
  when:
    - win25cis_rule_2_3_5_3
    - prelim_win25cis_is_domain_controller
  tags:
    - level1-domaincontroller
    - rule_2.3.5.3
    - patch
    - ldap
    - NIST800-171_3.1.13
    - NIST800-171_3.5.2
    - NIST800-171_3.13.8
    - NIST800-53R5_AC-17_2
    - NIST800-53R5_IA-5
    - NIST800-53R5_IA-5_1
    - NIST800-53R5_SC-8
    - NIST800-53R5_SC-8_1
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
    name: LdapEnforceChannelBinding
    data: 2
    type: dword

- name: "2.3.5.4 | PATCH | Ensure Domain controller LDAP server signing requirements is set to Require signing DC only | Domain Controller"
  when:
    - win25cis_rule_2_3_5_4
    - prelim_win25cis_is_domain_controller
  tags:
    - level1-domaincontroller
    - rule_2.3.5.4
    - patch
    - ldap
    - NIST800-171_3.1.13
    - NIST800-171_3.5.2
    - NIST800-171_3.13.8
    - NIST800-53R5_AC-17_2
    - NIST800-53R5_IA-5
    - NIST800-53R5_IA-5_1
    - NIST800-53R5_SC-8
    - NIST800-53R5_SC-8_1
  block:
    - name: "2.3.5.4 | PATCH | Ensure Domain controller LDAP server signing requirements is set to Require signing DC only | Domain Controller | Set Value"
      ansible.windows.win_regedit:
        path: HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
        name: LDAPServerIntegrity
        data: 2
        type: dword

    - name: "2.3.5.4 | AUDIT | Ensure Domain controller LDAP server signing requirements is set to Require signing DC only | Domain Controller | Warn that Group Policy outranks this write"
      ansible.builtin.debug:
        msg:
          - "Warning!! On a domain controller LDAPServerIntegrity is governed by Group Policy."
          - "This registry write applies, and is then reverted at the next policy refresh"
          - "(every 5 minutes by default on a DC, and at every reboot). Host proven: the value"
          - "goes 1 -> 2 on write and back to 1 after gpupdate /force. To make 2.3.5.4 hold,"
          - "set it in the Default Domain Controllers Policy."

    - name: "2.3.5.4 | AUDIT | Ensure Domain controller LDAP server signing requirements is set to Require signing DC only | Domain Controller | Set warning count"
      vars:
        warn_control_id: '2.3.5.4'
      ansible.builtin.import_tasks:
        file: warning_facts.yml

- name: "2.3.5.5 | PATCH | Ensure Domain controller LDAP server signing requirements Enforcement is set to Enabled | Domain Controller"
  when:
    - win25cis_rule_2_3_5_5
    - prelim_win25cis_is_domain_controller
  tags:
    - level1-domaincontroller
    - rule_2.3.5.5
    - patch
    - ldap
    - NIST800-171_3.1.13
    - NIST800-171_3.5.2
    - NIST800-171_3.13.8
    - NIST800-53R5_AC-17_2
    - NIST800-53R5_IA-5
    - NIST800-53R5_IA-5_1
    - NIST800-53R5_SC-8
    - NIST800-53R5_SC-8_1
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\NTDS\Parameters
    name: LDAPServerForceIntegrity
    data: 1
    type: dword

- name: "2.3.5.6 | PATCH | Ensure 'Domain controller Refuse machine account password changes' is set to Disabled DC only | Domain Controller"
  when:
    - win25cis_rule_2_3_5_6
    - prelim_win25cis_is_domain_controller
  tags:
    - level1-domaincontroller
    - rule_2.3.5.6
    - patch
    - account
    - NIST800-171_3.4.1
    - NIST800-171_3.4.2
    - NIST800-171_3.4.6
    - NIST800-171_3.4.7
    - NIST800-171_3.13.1
    - NIST800-171_3.13.2
    - NIST800-53R5_CM-1
    - NIST800-53R5_CM-2
    - NIST800-53R5_AC-2
    - NIST800-53R5_CM-6
    - NIST800-53R5_CM-7
    - NIST800-53R5_CM-7_1
    - NIST800-53R5_CM-9
    - NIST800-53R5_SA-3
    - NIST800-53R5_SA-8
    - NIST800-53R5_SA-10
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Services\Netlogon\Parameters
    name: RefusePasswordChange
    data: 0
    type: dword
